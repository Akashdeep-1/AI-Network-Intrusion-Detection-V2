[mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true

[[mypy-overrides]]
module = "src.forecasting.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true

[[mypy-overrides]]
module = "src.inference"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true

[[mypy-overrides]]
module = "src.config"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[mypy-plugins]
pydantic.mypy = true

[[mypy-overrides]]
module = "torch.*"
ignore_missing_imports = true

[[mypy-overrides]]
module = "xgboost.*"
ignore_missing_imports = true

[[mypy-overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[[mypy-overrides]]
module = "streamlit.*"
ignore_missing_imports = true

[[mypy-overrides]]
module = "plotly.*"
ignore_missing_imports = true

[[mypy-overrides]]
module = "yaml.*"
ignore_missing_imports = true

[[mypy-overrides]]
module = "joblib.*"
ignore_missing_imports = true

[[mypy-overrides]]
module = "tests.*"
disallow_untyped_defs = false
ignore_missing_imports = true