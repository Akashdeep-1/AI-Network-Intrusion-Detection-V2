[tool.ruff]
target-version = "py311"
line-length = 100
indent-style = "space"
indent-width = 4

select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "T20", "SIM", "RUF", "ARG", "PTH", "TRY", "ERA", "PL"
]

ignore = [
    "E501", "B008", "SIM102", "TRY003"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.isort]
known-first-party = ["src", "app", "tests"]
known-third-party = ["pandas", "numpy", "torch", "sklearn", "xgboost", "streamlit", "plotly", "yaml", "pydantic", "pydantic_settings"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
combine-as-imports = true

[tool.ruff.pyupgrade]
py311-plus = true

[tool.ruff.flake8-bugbear]
no-doctest = true

[tool.ruff.pydocstyle]
convention = "numpy"

[project]
name = "ai-network-intrusion-detection"
version = "0.1.0"
description = "Dual-pipeline network intrusion detection and temporal forecasting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"